[build]
  publish = "."
  functions = "netlify/functions"
  # OG ফাংশনকে বান্ডল করা ডেটা দেওয়া হয় — প্রতিবার স্বয়ংক্রিয়ভাবে
  command = "node tools/sync-function-data.js"

# ════════════════════════════════════════════════════════════════════════════
# SMO/P0 — SEO-ক্রিটিক্যাল রুট এখন সার্ভার-রেন্ডার হয় (সঠিক OG ট্যাগসহ)
#
# আগে: /news/*, /category/*, /desk/* সবই /index.html-এ status=200 দিয়ে যেত।
#       ফলে প্রতিটি আর্টিকেল URL অভিন্ন স্ট্যাটিক ডকুমেন্ট ফেরত দিত এবং
#       ফেসবুকের ক্রলার কখনোই আর্টিকেল-নির্দিষ্ট og:title/og:image পেত না।
#       (লাইভ সাইটে যাচাই করা: facebookexternalhit হোমপেজের ট্যাগই পেত।)
# এখন: /news/* একটি Netlify Function-এ যায়, যা প্রথম বাইটেই খবরের নিজের
#       og:title, og:image (১২০০x৬৩০), og:url ও og:type=article দেয়।
#
# কেন ফাংশন, Oracle প্রক্সি নয়: ফেসবুকের প্রিভিউ আজই ঠিক হওয়া দরকার।
# Oracle VM (Phase B) চালু হলে এবং ডোমেইন+TLS হলে ফাংশনটি ঐচ্ছিক হয়ে যাবে —
# তখন শুধু এই redirect-টি পরিবর্তন করে প্রক্সিতে পাঠাতে হবে।
#
# বিল্ড ধাপে tools/sync-function-data.js চলে, তাই publish করা প্রতিটি
# কনফিগের সাথে ফাংশনের ডেটা কখনো বেসামঞ্জস্য হয় না।
# ════════════════════════════════════════════════════════════════════════════

[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/article-og"
  status = 200
[[redirects]]
  from = "/category/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/desk/*"
  to = "/index.html"
  status = 200

# API — Netlify Functions (Oracle সার্ভার চালু হলে ঐচ্ছিক হয়ে যাবে)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
# /search/* ক্লায়েন্ট-সাইডই থাকবে
[[redirects]]
  from = "/search/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin-manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# ══════════════════════════════════════════════════════════════════════
# /og/* — ওজি ছবি Oracle থেকে প্রক্সি করা হয়
# ══════════════════════════════════════════════════════════════════════
# কেন: প্রতি সংবাদের জন্য ১২০০x৬৩০ ব্র্যান্ডেড কার্ড Oracle-এর
# lib/ogimage.js তাৎক্ষণিকভাবে তৈরি করে। রেপোতে শুধু কয়েকটি আগে তৈরি
# করা ছবি থাকে, তাই নতুন সংবাদের /og/<slug>.jpg চাইলে ৪০৪ আসত এবং
# ফেসবুকের প্রিভিউ কার্ড ছবিহীন হয়ে যেত।
# এই প্রক্সি থাকায় যেকোনো slug-এর ছবি চাইলেই Oracle বানিয়ে দেয়।
# ══════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/og/*"
  to = "https://bne.147-224-13-31.nip.io/og/:splat"
  status = 200
  force = false

# সংবাদের নিজস্ব ছবি — Oracle সার্ভার থেকে প্রক্সি করা হয়।
# সোর্স সাইটের ছবি সরাসরি দেখানো হয় না (হটলিংক ব্লকড, ৪০৩);
# সার্ভার সেগুলো নিজে নামিয়ে নিজের স্টোরেজে রাখে।
[[redirects]]
  from = "/img/*"
  to = "https://bne.147-224-13-31.nip.io/img/:splat"
  status = 200
  force = true
