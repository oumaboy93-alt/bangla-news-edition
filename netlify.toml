[build]
  publish = "."
  functions = "netlify/functions"
  # OG ফাংশনকে বান্ডল করা ডেটা দেওয়া হয় — প্রতিবার স্বয়ংক্রিয়ভাবে
  command = "node tools/sync-function-data.js"

# ════════════════════════════════════════════════════════════════════════════
# SMO/P0 — SEO-ক্রিটিক্যাল রুট এখন সার্ভার-রেন্ডার হয় (সঠিক OG ট্যাগসহ)
#
# আগে: /news/*, /category/*, /desk/* সবই /index.html-এ status=200 দিয়ে যেত।
#       ফলে প্রতিটি আর্টিকেল URL অভিন্ন স্ট্যাটিক ডকুমেন্ট ফেরত দিত এবং
#       ফেসবুকের ক্রলার কখনোই আর্টিকেল-নির্দিষ্ট og:title/og:image পেত না।
#       (লাইভ সাইটে যাচাই করা: facebookexternalhit হোমপেজের ট্যাগই পেত।)
# এখন: /news/* একটি Netlify Function-এ যায়, যা প্রথম বাইটেই খবরের নিজের
#       og:title, og:image (১২০০x৬৩০), og:url ও og:type=article দেয়।
#
# কেন ফাংশন, Oracle প্রক্সি নয়: ফেসবুকের প্রিভিউ আজই ঠিক হওয়া দরকার।
# Oracle VM (Phase B) চালু হলে এবং ডোমেইন+TLS হলে ফাংশনটি ঐচ্ছিক হয়ে যাবে —
# তখন শুধু এই redirect-টি পরিবর্তন করে প্রক্সিতে পাঠাতে হবে।
#
# বিল্ড ধাপে tools/sync-function-data.js চলে, তাই publish করা প্রতিটি
# কনফিগের সাথে ফাংশনের ডেটা কখনো বেসামঞ্জস্য হয় না।
# ════════════════════════════════════════════════════════════════════════════

# ── নিরাপত্তা: পুরনো ক্লায়েন্ট-সাইড অ্যাডমিন প্যানেল স্থায়ীভাবে বন্ধ ──────
# admin.html ফাইলটিতে পাসকোড সরাসরি লেখা ছিল এবং তা সর্বজনীনভাবে পড়া যেত।
# ফাইলটি রেপো থেকে সরানো হয়েছে; তার সঙ্গে 410 (Gone) দেওয়া হলো যাতে
# কোনো পুরনো লিংক, ক্যাশ বা বুকমার্ক আর কখনো সেই পাতা না ফেরায়।
# 404 নয়, 410 — কারণ এটি স্থায়ীভাবে বাদ দেওয়া হয়েছে, সাময়িক নয়।
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/sw-admin.js"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/admin-sw.js"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/admin-manifest.json"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/admin-manifest.webmanifest"
  to = "/"
  status = 410
  force = true

# ── অভ্যন্তরীণ ফাইল যেন কখনো সর্বজনীন না হয় ────────────────────────────
# Netlify `--dir .` দিয়ে পুরো রেপো রুট প্রকাশ করে, তাই সোর্স-কোড, টেস্ট,
# ওয়ার্কফ্লো, অভ্যন্তরীণ স্ক্রিপ্ট ও আউটরিচ তালিকা সবই ডাউনলোডযোগ্য হয়ে
# যেত। এগুলো সাইটের কোনো অংশ নয় — কেবল বিল্ড/রক্ষণাবেক্ষণের জন্য।
# (বিল্ড ধাপে `node tools/...` চলে, কিন্তু সেটি ডিস্ক থেকে পড়ে, HTTP নয় —
# তাই ব্লক করলে বিল্ড ভাঙে না।)
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/legacy/*"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/sponsor_leads_outreach.json"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/sponsor_hunter.js"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/deploy.sh"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/Start_FB_Auto_Poster.command"
  to = "/"
  status = 410
  force = true
[[redirects]]
  from = "/FB_SETUP_GUIDE.md"
  to = "/"
  status = 410
  force = true

# ── sitemap: প্রকৃত সংবাদ-URL সহ ডাইনামিক sitemap ─────────────────────────
# আগে রুটে একটি স্থির sitemap.xml ফাইল ছিল যাতে কেবল ৫টি URL থাকত —
# ১২৮টি সংবাদের একটিও থাকত না, ফলে গুগল সংবাদ-পাতাগুলো খুঁজে পেত না।
# Netlify-তে redirect স্থির ফাইলের চেয়ে অগ্রাধিকার পায়, তাই Oracle-এর
# ডাইনামিক sitemap (প্রতিটি /news/<slug> সহ) এখান থেকেই পরিবেশন হবে।
[[redirects]]
  from = "/sitemap.xml"
  to = "https://bne.147-224-13-31.nip.io/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/article-og"
  status = 200
[[redirects]]
  from = "/category/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/desk/*"
  to = "/index.html"
  status = 200

# API — Netlify Functions (Oracle সার্ভার চালু হলে ঐচ্ছিক হয়ে যাবে)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
# /search/* ক্লায়েন্ট-সাইডই থাকবে
[[redirects]]
  from = "/search/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# সংবাদের পাতা — সার্চ ইঞ্জিনকে পরিষ্কার সংকেত, ক্লিক-ট্র্যাকিং ঠিক রাখতে
# Referrer পাঠানো হয় (উৎস মাপার জন্য দরকার) কিন্তু কেবল origin পর্যন্ত।
[[headers]]
  for = "/news/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

# /admin* কখনো ইনডেক্স হবে না (এবং Netlify-এর রুটে থাকলে সেটিও নোইনডেক্স)
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# ══════════════════════════════════════════════════════════════════════
# /og/* — ওজি ছবি Oracle থেকে প্রক্সি করা হয়
# ══════════════════════════════════════════════════════════════════════
# কেন: প্রতি সংবাদের জন্য ১২০০x৬৩০ ব্র্যান্ডেড কার্ড Oracle-এর
# lib/ogimage.js তাৎক্ষণিকভাবে তৈরি করে। রেপোতে শুধু কয়েকটি আগে তৈরি
# করা ছবি থাকে, তাই নতুন সংবাদের /og/<slug>.jpg চাইলে ৪০৪ আসত এবং
# ফেসবুকের প্রিভিউ কার্ড ছবিহীন হয়ে যেত।
# এই প্রক্সি থাকায় যেকোনো slug-এর ছবি চাইলেই Oracle বানিয়ে দেয়।
# ══════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/og/*"
  to = "https://bne.147-224-13-31.nip.io/og/:splat"
  status = 200
  force = false

# সংবাদের নিজস্ব ছবি — Oracle সার্ভার থেকে প্রক্সি করা হয়।
# সোর্স সাইটের ছবি সরাসরি দেখানো হয় না (হটলিংক ব্লকড, ৪০৩);
# সার্ভার সেগুলো নিজে নামিয়ে নিজের স্টোরেজে রাখে।
[[redirects]]
  from = "/img/*"
  to = "https://bne.147-224-13-31.nip.io/img/:splat"
  status = 200
  force = true
