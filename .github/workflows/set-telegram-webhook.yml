name: Set Telegram Webhook (BNE)

# ══════════════════════════════════════════════════════════════════════════
# ★ কেন এই ওয়ার্কফ্লো ★
#
# অ্যাডমিন বটের কোড Netlify Function হিসেবে লাইভ, কিন্তু Telegram-এর webhook
# ভুল একটি ঠিকানায় (tele.goldenherd.com) বসানো ছিল — যেটি কোনো উত্তর দেয় না।
# ফলে বটের কাছে আপনার কোনো বার্তাই পৌঁছাত না।
#
# webhook বসাতে Telegram-কে TELEGRAM_WEBHOOK_SECRET-এর হুবহু মান দিতে হয়,
# কারণ ফাংশনটি সেই মান দিয়ে যাচাই করে। কিন্তু সেই মান Netlify-এর
# পরিবেশ-চলকে আছে, যা ড্যাশবোর্ড ছাড়া পড়া যায় না।
#
# এই ওয়ার্কফ্লো সেটি রানারের ভেতরেই পড়ে, Telegram-কে পাঠায়, এবং
# কোথাও ছাপায় না — শুধু ফলাফল ছাপায় (ok / description)।
#
# ★ ভবিষ্যতে ডোমেইন বদলালে ★
#   Actions → এই ওয়ার্কফ্লো → Run workflow → origin-এ নতুন ঠিকানা দিন।
# ══════════════════════════════════════════════════════════════════════════

on:
  push:
    paths:
      - '.github/workflows/set-telegram-webhook.yml'
  workflow_dispatch:
    inputs:
      origin:
        description: 'সাইটের origin (webhook এখানেই বসবে)'
        required: false
        default: 'https://bangla-news-edition-bd.netlify.app'

permissions:
  contents: read

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Set the Telegram webhook (secret never printed)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_BD }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_BD }}
          ORIGIN: ${{ inputs.origin || 'https://bangla-news-edition-bd.netlify.app' }}
        run: |
          set -uo pipefail

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN GitHub Secret নেই — webhook বসানো সম্ভব নয়।"
            exit 1
          fi
          echo "::add-mask::$BOT_TOKEN"

          echo "origin: $ORIGIN"

          # ── ১. Netlify থেকে webhook secret উদ্ধার (ব্যর্থ হলেও চলবে) ──
          SECRET=""
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && [ -n "${NETLIFY_SITE_ID:-}" ]; then
            ACCOUNT=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('account_slug') or '')" 2>/dev/null || echo "")
            echo "netlify account resolved: $([ -n "$ACCOUNT" ] && echo yes || echo no)"
            if [ -n "$ACCOUNT" ]; then
              SECRET=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                "https://api.netlify.com/api/v1/accounts/$ACCOUNT/env?site_id=$NETLIFY_SITE_ID" \
                | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
except Exception:
    print(''); raise SystemExit
want = 'TELEGRAM_WEBHOOK_SECRET'
out = ''
def walk(entry):
    if entry.get('key') != want: return ''
    vals = entry.get('values') or []
    for v in vals:
        val = (v or {}).get('value')
        if val: return val
    return entry.get('value') or ''
if isinstance(data, list):
    for e in data:
        if isinstance(e, dict):
            got = walk(e)
            if got: out = got; break
print(out)
" 2>/dev/null || echo "")
            fi
          else
            echo "Netlify credentials absent — will set the webhook without a secret"
          fi

          if [ -n "$SECRET" ]; then
            echo "webhook secret: found (value hidden)"
            echo "::add-mask::$SECRET"
          else
            echo "::warning::TELEGRAM_WEBHOOK_SECRET পাওয়া যায়নি — সিক্রেট ছাড়াই সেট করা হচ্ছে"
          fi

          # ── ২. webhook বসানো ──
          URL="$ORIGIN/.netlify/functions/telegram"
          echo "webhook url: $URL"

          if [ -n "$SECRET" ]; then
            RES=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
              --data-urlencode "url=$URL" \
              --data-urlencode "secret_token=$SECRET" \
              --data-urlencode "drop_pending_updates=false" \
              --data-urlencode 'allowed_updates=["message","edited_message","callback_query"]')
          else
            RES=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
              --data-urlencode "url=$URL" \
              --data-urlencode "drop_pending_updates=false" \
              --data-urlencode 'allowed_updates=["message","edited_message","callback_query"]')
          fi

          echo "setWebhook → $(echo "$RES" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("ok"), "|", d.get("description",""))' 2>/dev/null || echo "$RES")"

          # ── ৩. যাচাই (secret ফেরত আসে না, তাই ছাপা নিরাপদ) ──
          sleep 2
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin).get('result', {})
print('webhook url      :', d.get('url'))
print('pending updates  :', d.get('pending_update_count'))
print('last error       :', d.get('last_error_message') or 'none')
print('allowed updates  :', d.get('allowed_updates'))
"
