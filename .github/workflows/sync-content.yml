name: Sync content from Oracle

# ════════════════════════════════════════════════════════════════════════
# কেন এই ওয়ার্কফ্লো দরকার
# ════════════════════════════════════════════════════════════════════════
# লাইভ সাইটের প্রতিটি পৃষ্ঠা GitHub-এর data/bne-config.json থেকে ডেটা পড়ে
# (settings.remoteConfigUrl)। কিন্তু সংবাদ তৈরি হয় Oracle সার্ভারের
# ডেটাবেজে — অ্যাডমিন প্যানেল থেকে হাতে, অথবা RSS সংগ্রহ ইঞ্জিন দিয়ে
# স্বয়ংক্রিয়ভাবে। এই দুইয়ের মধ্যে সেতু না থাকলে সাইটে নতুন সংবাদ
# পৌঁছায় না এবং পোস্ট হওয়া লিংকে "সংবাদ পাওয়া যায়নি" দেখায়।
#
# এই ওয়ার্কফ্লো প্রতি ১০ মিনিটে Oracle-এর পাবলিক /api/config আনে,
# data/bne-config.json হালনাগাদ করে, OG ফাংশনের ডেটা পুনর্গঠন করে এবং
# কমিট পুশ করে। পুশ হলেই Netlify নিজে থেকে নতুন বিল্ড শুরু করে।
#
# ফলে সম্পূর্ণ শৃঙ্খল স্বয়ংক্রিয়:
#   RSS → সংগ্রহ → সাইটের সংবাদ (Oracle DB)
#        → এই সিঙ্ক → GitHub → Netlify → লাইভ সাইট + OG কার্ড
#        → অটো-পোস্টার → ফেসবুক + টেলিগ্রাম
# ════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # প্রতি ৫ মিনিটে — কেন এত ঘন ঘন:
    # স্বয়ংক্রিয় সংগ্রহ প্রতি ১৫ মিনিটে সাইটে নতুন সংবাদ যোগ করে। সিঙ্ক
    # দেরিতে হলে সামাজিক পোস্টিংয়ের সময় সেই সংবাদের URL এখনো লাইভ হয়নি
    # → ফেসবুক "সংবাদ পাওয়া যায়নি" ক্যাশ করে (ঠিক এটাই হয়েছিল ৩টি
    # পোস্টে)। ৫ মিনিটের সিঙ্ক + ৩০ মিনিটের পোস্টিং ক্রন থাকলে সংবাদ
    # পোস্ট হওয়ার আগেই লাইভ থাকে।
    - cron: '*/5 * * * *'
  workflow_dispatch:          # হাতে চালানোর সুযোগ

# একই সময়ে দুইবার চললে কমিট সংঘর্ষ এড়াতে
concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # সিঙ্ক-শেষে social-auto-post.yml হাতে চালু করতে দরকার
      # (সিঙ্ক-পুশে `[skip ci]` থাকে, তাই স্বয়ংক্রিয় ট্রিগার কাজ করে না)
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Oracle থেকে কনটেন্ট আনা ও মেলানো
        env:
          # GitHub Secrets-এ না থাকলে ডিফল্ট Oracle ঠিকানাই ব্যবহৃত হয়
          ORACLE_ORIGIN: ${{ secrets.META_API_BASE || 'https://bne.147-224-13-31.nip.io' }}
        run: node tools/sync-from-oracle.js

      # ══════════════════════════════════════════════════════════════════════
      # ★ প্রতি সংবাদের সাথে সামঞ্জস্যপূর্ণ ছবি ★
      # ──────────────────────────────────────────────────────────────────────
      # Oracle ছবি সংগ্রহ করে না (৫০০-র মধ্যে মাত্র ১টিতে ছবি ছিল), তাই আগে
      # প্রতিটি পোস্টে একই জেনেরিক লাল কার্ড দেখাত — খবরের সাথে সম্পর্কহীন।
      # এই ধাপ মূল সংবাদমাধ্যমের ফিডে একই শিরোনামের খুঁজে তার আসল ছবি বসায়;
      # না পেলে বিভাগ-ভিত্তিক ব্র্যান্ডেড ছবি (খেলা→sports.jpg ইত্যাদি)।
      # ব্যর্থ হলেও বিল্ড থামে না — আগের ছবি নিয়েই এগিয়ে যায়।
      - name: প্রতি সংবাদের ছবি সমৃদ্ধকরণ
        run: |
          node tools/enrich-images.js || echo "::warning::ছবি সমৃদ্ধকরণ ব্যর্থ — আগের ছবি নিয়েই এগোনো হচ্ছে।"

      - name: OG ফাংশনের বান্ডল করা ডেটা পুনর্গঠন
        run: node tools/sync-function-data.js

      # ══════════════════════════════════════════════════════════════════════
      # ★ কেন এখানেই ডিপ্লয় করা হয় (আর শুধু পুশে ভরসা করা হয় না) ★
      # ──────────────────────────────────────────────────────────────────────
      # সিঙ্ক-কমিটের বার্তায় `[skip ci]` থাকে (কারণ: প্রতি ৫ মিনিটে CI-এর
      # পুরো Quality Gate চালানো অর্থহীন)। কিন্তু `[skip ci]` ওই পুশ থেকে
      # **সব** ওয়ার্কফ্লো বন্ধ করে দেয় — Deploy to Netlify সহ।
      #
      # লাইভ প্রমাণ: ১৮ সেপ্টেম্বরের পর প্রতিটি কমিটই `[skip ci]` ছিল, তাই
      # deploy.yml একবারও চালু হয়নি এবং সাইট ১২৩টি সংবাদে জমে গিয়েছিল।
      #
      # সমাধান: সিঙ্ক শেষে এখানেই সরাসরি ডিপ্লয় করা হয়। ফলে পুশ-ট্রিগার
      # যাই হোক, নতুন সংবাদ সাথে সাথেই লাইভ হয়।
      # ══════════════════════════════════════════════════════════════════════
      - name: পরিবর্তন থাকলে কমিট ও পুশ
        id: commit
        run: |
          git config --global user.name "BNE Bot"
          git config --global user.email "bot@bne.local"
          git add data/bne-config.json netlify/functions/_data.json
          if git diff --cached --quiet; then
            echo "✅ কোনো পরিবর্তন নেই — কমিট লাগবে না।"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(sync): Oracle থেকে কনটেন্ট হালনাগাদ [skip ci]"
            git push
            echo "✅ পুশ সম্পন্ন।"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Netlify-তে সাথে সাথে ডিপ্লয় (সিঙ্ক-কমিটে [skip ci] থাকায় এখানেই করতে হয়)
        if: steps.commit.outputs.changed == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_BD }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_BD }}
          SITE_BASE: ${{ secrets.SITE_BASE }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN_BD / NETLIFY_SITE_ID_BD সেট করা নেই — নতুন সংবাদ লাইভ হবে না।"
            exit 1
          fi
          # সাইটের ঠিকানা সব ফাইলে বসানো (canonical, og:url, gn-feed, টুল-ডিফল্ট)
          node tools/set-site-origin.js
          npm install -g netlify-cli
          netlify deploy --prod --no-build --dir . --site "$NETLIFY_SITE_ID"
          echo "✅ নতুন সংবাদ লাইভ — এখন সোশ্যাল পোস্টার নিরাপদে পোস্ট করতে পারবে।"

      # ── সোশ্যাল পোস্টার কেন এখন এখানে চালু করা হয় না ──────────────────
      # আগে প্রতি সিঙ্কে (১৫ মিনিটে) পোস্টারও চালু হত। এখন সিঙ্ক আর পোস্টারের
      # সময়সূচি আলাদা রাখা হয়েছে: Netlify-র bot-tick ফাংশন প্রতি ৩০ মিনিটে
      # পোস্টার চালায়। নইলে দিনে ৯৬ বারের বেশি পোস্ট রান হয়ে যেত এবং
      # একই চ্যানেলে অপ্রয়োজনীয়ভাবে অনেক খবর চলে যেত।
      #
      # সিঙ্ক এখন শুধু কনটেন্ট হালনাগাদ ও সাইট প্রকাশ করে — যাতে পোস্টার
      # যখনই চলবে, লিংকগুলো তখনই লাইভ থাকে।
