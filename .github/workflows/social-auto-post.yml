name: Automated Social Media Auto-Poster

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিটে — নতুন সংবাদ টেলিগ্রাম + ফেসবুক পেজে (প্রিভিউসহ)
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Dual Dispatch Social Poster (Telegram + Facebook)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_POST_MODE: ${{ secrets.FB_POST_MODE }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node auto_social_poster.js

      - name: Commit Last Posted Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_posted.json || true
          git commit -m "chore: update last posted social cache [skip ci]" || true
          git push || true
