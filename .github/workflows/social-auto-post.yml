name: Automated Social Media Auto-Poster

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিটে — নতুন সংবাদ টেলিগ্রাম + ফেসবুক পেজে (প্রিভিউসহ)
  workflow_dispatch:

# ── কেন permissions দরকার ──────────────────────────────────────────────
# নিচের "Commit Last Posted Cache" ধাপটি last_posted.json পুশ করে। ডিফল্ট
# GITHUB_TOKEN-এ contents: write না থাকলে পুশ 403-এ ব্যর্থ হয় এবং ডিডুপ
# ক্যাশ কখনো সংরক্ষিত হয় না — ফলে একই খবর বারবার পোস্ট হওয়ার ঝুঁকি থাকে।
# (লাইভ লগে প্রমাণিত: "Permission to ... denied to github-actions[bot]"।)
permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Dual Dispatch Social Poster (Telegram + Facebook)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_POST_MODE: ${{ secrets.FB_POST_MODE }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

          # ── সংবাদের উৎস (SMO/P2) ──────────────────────────────────────
          # আগে এই ব্লকে META_API_BASE ফাঁকা ছিল, ফলে পোস্টার Netlify-এর
          # /api/queue খুঁজত — যেখানে এমন কোনো রুটই নেই (লাইভ যাচাই: 404)।
          # পরিণতি: প্রতি রানে "কিউতে নতুন কিছু নেই" এবং একটিও খবর ফেসবুক বা
          # টেলিগ্রামে যেত না।
          #
          # এখন Secret খালি থাকলেও Oracle ডিফল্টে চলে (|| অপারেটর), আর
          # পোস্টার নিজের /api/config থেকেই প্রকাশিত সংবাদ বেছে নেয়।
          META_API_BASE: ${{ secrets.META_API_BASE || 'https://bne.147-224-13-31.nip.io' }}
          QUEUE_TOKEN: ${{ secrets.QUEUE_TOKEN }}
          # ★ নিজস্ব সংবাদ কোথা থেকে: local (ডিফল্ট) | oracle ★
          # local = রিপোর data/bne-config.json। এটিই সঠিক, কারণ
          # tools/enrich-images.js সংবাদের ছবি বসায় এই ফাইলেই — Oracle-এর
          # ডেটায় কোনো ছবি নেই। Oracle থেকে পড়লে পোস্টে ছবি আসত না।
          OWN_SOURCE: local
          # পুরনো আর্কাইভ একবারে পোস্ট হয়ে স্প্যাম ঠেকাতে সময়-সীমা (ঘণ্টা)
          MAX_AGE_HOURS: '48'
          # ডিফল্ট "api" — বাহ্যিক RSS বন্ধ। ইচ্ছাকৃতভাবে অন্যের খবর পোস্ট
          # করতে চাইলে আলাদা ওয়ার্কফ্লোতে POSTER_MODE=legacy দিন।
          POSTER_MODE: api
          # ★ এই ঠিকানাই পোস্টের লিংক তৈরি করে ও লিংক-যাচাই করে। হোস্ট বদলালে
          #   কেবল এই একটি মান (বা SITE_BASE Secret) বদলালেই যথেষ্ট।
          SITE_BASE: ${{ secrets.SITE_BASE || 'https://bangla-news-edition.netlify.app' }}
        run: node auto_social_poster.js

      # ══════════════════════════════════════════════════════════════════════
      # ★ ডিডুপ ক্যাশ সংরক্ষণ — পুনঃচেষ্টা সহ ★
      # ──────────────────────────────────────────────────────────────────────
      # আগে ছিল কেবল `git push || true`। রিমোট এগিয়ে থাকলে (যেমন কনটেন্ট
      # সিঙ্ক একই সময়ে পুশ করলে) পুশ চুপচাপ ব্যর্থ হত এবং ক্যাশ হারিয়ে যেত।
      # পরিণতি: পরের রানে সেই খবরগুলো "নতুন" বলে ধরা পড়ে আবার পোস্ট হয়ে যেত
      # — অর্থাৎ একই সংবাদ একাধিকবার ফেসবুক পেজ ও চ্যানেলে।
      #
      # এখন পুশ ব্যর্থ হলে রিমোট এনে আবার চেষ্টা করা হয় (৩ বার)। ক্যাশ ফাইলে
      # সংঘর্ষ হলে দুই পাশের রেকর্ড একসাথে রাখা হয় — কোনো পোস্ট-রেকর্ড হারায় না।
      - name: Commit Last Posted Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_posted.json || true
          git commit -m "chore: update last posted social cache [skip ci]" || { echo "ক্যাশে কোনো পরিবর্তন নেই"; exit 0; }

          for try in 1 2 3; do
            if git push origin HEAD:main 2>/dev/null; then
              echo "✅ ক্যাশ সংরক্ষিত (চেষ্টা $try)"; exit 0
            fi
            echo "⚠️ পুশ ব্যর্থ (চেষ্টা $try) — রিমোট এনে আবার মেলানো হচ্ছে…"
            git fetch -q origin main
            if ! git rebase -q origin/main 2>/dev/null; then
              node tools/merge-posted-cache.js || git checkout --theirs last_posted.json 2>/dev/null || true
              git add last_posted.json
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          echo "::warning::ক্যাশ ৩ চেষ্টাতেও সংরক্ষণ করা যায়নি — পরের রানে পুনরায় চেষ্টা হবে"
          exit 0
